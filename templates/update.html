<h1>Update Employee</h1>
<style>
        body {
            background-color: black; 
            color: white;            
        }
    </style>
<form method="POST">
    <label>Name:</label>
    <input type="text" name="name" value="{{ emp.name }}" required>
    
    <label>Department:</label>
    <input type="text" name="department" value="{{ emp.department }}">
    
    <label>Role:</label>
    <input type="text" name="role" value="{{ emp.role }}" required>
    
    <label>Salary:</label>
    <input type="number" name="salary" value="{{ emp.salary }}" required>
    
    <button type="submit">Update</button>
</form>
